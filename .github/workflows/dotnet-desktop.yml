name: .NET Desktop

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build the application
      run: dotnet build VideoHarvester.sln --configuration ${{ matrix.configuration }}

    - name: Run download tests
      run: dotnet run --project tests/VideoHarvester.DownloadTests --configuration ${{ matrix.configuration }}

    - name: Run update tests
      run: dotnet run --project tests/VideoHarvester.UpdateTests --configuration ${{ matrix.configuration }}

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Set release version
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^v', ''
        if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
          throw "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix."
        }
        "APP_VERSION=$version" >> $env:GITHUB_ENV

    - name: Publish Windows application with bundled runtime
      run: dotnet publish VideoHarvester/VideoHarvester.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish "-p:Version=$env:APP_VERSION"

    - name: Add pinned download toolchain
      shell: pwsh
      run: ./eng/Install-ReleaseToolchain.ps1 -OutputDirectory ./publish

    - name: Restore packaging tool
      run: dotnet tool restore

    - name: Create installer and update packages
      run: dotnet vpk pack --packId VideoHarvester --packVersion $env:APP_VERSION --packDir ./publish --mainExe VideoHarvester.exe --packTitle VideoHarvester --packAuthors pk-dev-cs --runtime win-x64 --channel win --icon VideoHarvester/Images/icon.ico --outputDir ./Releases

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: Releases/*
        fail_on_unmatched_files: true
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        name: Release ${{ github.ref_name }}
        body: |
          ## VideoHarvester ${{ github.ref_name }}

          ### Installation
          - Use the Setup.exe asset to install the application, or extract the portable ZIP to a writable folder.
          - Both packages include the .NET runtime, yt-dlp, FFmpeg, and Node.js. No separate tool installation is required.
          - Installed and portable builds check for stable updates. Download an update, then choose Update and restart or Later. Finish or remove unfinished queue items before installing.

          ### Upgrading from older ZIP releases
          - Close VideoHarvester first. Extract the new portable ZIP into the existing application folder to migrate its downloads.db automatically on first launch.
          - Alternatively, before first running the new application, copy the old downloads.db to %LOCALAPPDATA%\VideoHarvester\downloads.db. Keep the original as a backup.
          - Settings in %APPDATA%\VideoHarvester are preserved.

          ### Requirements
          - 64-bit Windows 10/11

          See the generated release notes below for changes.
